<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TORALIS · Cohort View</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/labels.css">
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">T</span><div><h1>TORALIS</h1><p>Cohort label review</p></div></div>
    <div class="status"><span id="status-dot"></span><span id="status">Connecting…</span></div>
  </header>
  <aside class="controls">
    <section>
      <div class="eyebrow">Slice navigation</div>
      <div class="segment" id="orientation">
        <button data-value="axial" class="active">Axial</button><button data-value="coronal">Coronal</button><button data-value="sagittal">Sagittal</button>
      </div>
      <div class="sub-label">Align subjects by</div>
      <div class="segment" id="alignment">
        <button data-value="peak" class="active">Peak label</button><button data-value="volume">Volume position</button>
      </div>
      <div class="slider-head"><label for="position">Relative position</label><output id="position-value">Per subject</output></div>
      <input id="position" type="range" min="0" max="1000" value="500" disabled>
      <div class="nav-row"><button id="previous" class="square" title="Previous slice" disabled>←</button><button id="play" class="play" disabled>▶ Play</button><button id="next" class="square" title="Next slice" disabled>→</button></div>
      <p class="hint" id="navigation-hint">Each subject is showing its densest labeled slice.</p>
    </section>
    <section>
      <div class="eyebrow">Comparison</div>
      <div class="view-grid" id="mode">
        <button data-value="overlay" class="active"><i class="overlay-icon"></i>Overlay</button>
        <button data-value="split"><i class="split-icon"></i>Side by side</button>
        <button data-value="scan"><i class="scan-icon"></i>Scan only</button>
        <button data-value="labels"><i class="label-icon"></i>Labels only</button>
      </div>
      <label class="switch-row"><span>Label outlines</span><input id="outline" type="checkbox"><i></i></label>
      <div class="slider-head"><label for="opacity">Label opacity</label><output id="opacity-value">62%</output></div>
      <input id="opacity" type="range" min="0" max="100" value="62">
    </section>
    <section>
      <div class="eyebrow">CT window</div>
      <div class="presets" id="presets"><button data-c="40" data-w="400" class="active">Soft tissue</button><button data-c="-600" data-w="1500">Lung</button><button data-c="500" data-w="2000">Bone</button></div>
      <div class="number-row"><label>Level<input id="center" type="number" value="40"></label><label>Width<input id="window" type="number" min="1" value="400"></label></div>
    </section>
    <section>
      <div class="eyebrow">Layout</div>
      <label class="slider-head" for="columns"><span>Columns</span><output id="columns-value">3</output></label>
      <input id="columns" type="range" min="2" max="6" value="3">
      <label class="search"><span>⌕</span><input id="search" placeholder="Filter subject…"></label>
    </section>
    <footer><span class="swatch"></span> Ground-truth segmentation<br><small id="dataset"></small></footer>
  </aside>
  <main>
    <div class="main-head"><div><div class="eyebrow">Cross-subject comparison</div><h2>All scans</h2></div><div id="count">—</div></div>
    <div id="grid" class="grid" style="--columns:3"></div>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-head"><div><strong></strong><span class="dimensions"></span></div><span class="slice-index"></span></div>
      <div class="viewport"><div class="loader"></div><img alt=""><span class="error">Could not render</span><span class="left-tag">SCAN</span><span class="right-tag">OVERLAY</span></div>
      <div class="card-foot"><span class="label-state"><i></i> Label mask</span><span class="spacing"></span></div>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
